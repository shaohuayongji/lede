name: Build LEDE J4125

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "0 20 * * 5"

jobs:
  build:
    name: Build x86_64 firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano \
            jq ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Select latest rtp2httpd release
        run: |
          RTP2HTTPD_TAG="$(curl -fsSL https://api.github.com/repos/stackia/rtp2httpd/releases/latest | jq -r '.tag_name')"
          if [[ ! "${RTP2HTTPD_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid rtp2httpd release tag: ${RTP2HTTPD_TAG}" >&2
            exit 1
          fi
          sed -i "s#^src-git rtp2httpd .*#src-git rtp2httpd https://github.com/stackia/rtp2httpd.git;${RTP2HTTPD_TAG}#" feeds.conf.default
          echo "Building rtp2httpd ${RTP2HTTPD_TAG}"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a

      - name: Add custom LuCI packages
        run: |
          ./scripts/prepare-custom-luci-apps.sh

      - name: Install feeds
        run: |
          ./scripts/feeds install -a

      - name: Patch dockerd GitHub runner compatibility
        run: |
          DOCKERD_PATCH_DIR="package/feeds/packages/dockerd/patches"
          mkdir -p "${DOCKERD_PATCH_DIR}"
          if grep -RqsE 'skip copy nested binaries|Skipping .*not found in PATH' "${DOCKERD_PATCH_DIR}"; then
            echo 'The dockerd feed already contains the nested-binary copy fix.'
          else
            cp patches/dockerd/999-skip-copy-nested-binaries.patch "${DOCKERD_PATCH_DIR}/"
          fi

      - name: Apply J4125 config
        run: |
          cp configs/j4125.config .config
          make defconfig
          grep -qx 'CONFIG_PACKAGE_rtp2httpd=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-rtp2httpd=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-ddns=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-package-manager=y' .config
          grep -qx 'CONFIG_PACKAGE_alist=y' .config
          grep -qx 'CONFIG_PACKAGE_tailscale=y' .config
          for package_name in \
            udpxy luci-app-udpxy frpc frps \
            luci-app-accesscontrol luci-app-alist luci-app-tailscale \
            luci-app-opkg luci-app-ssr-plus; do
            if grep -qx "CONFIG_PACKAGE_${package_name}=y" .config; then
              echo "Obsolete package must remain disabled: ${package_name}" >&2
              exit 1
            fi
          done

      - name: Patch Transmission miniupnpc compatibility
        run: |
          mkdir -p package/feeds/packages/transmission/patches
          cat > package/feeds/packages/transmission/patches/910-fix-miniupnpc-compat.patch <<'PATCH'
          --- a/libtransmission/upnp.c
          +++ b/libtransmission/upnp.c
          @@ -7,6 +7,7 @@
            * $Id$
            */
           
          +#include <stddef.h>
           #include <assert.h>
           #include <errno.h>
           
          @@ -221,4 +222,5 @@ tr_upnpPulse (tr_upnp * handle,
                   errno = 0;
                   if (UPNP_GetValidIGD (devlist, &handle->urls, &handle->data,
          -                             handle->lanaddr, sizeof (handle->lanaddr)) == UPNP_IGD_VALID_CONNECTED)
          +                             handle->lanaddr, sizeof (handle->lanaddr),
          +                             NULL, 0) == UPNP_IGD_VALID_CONNECTED)
                   {
          PATCH

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: lede-dl-${{ hashFiles('feeds.conf.default', 'configs/j4125.config') }}
          restore-keys: |
            lede-dl-

      - name: Download package sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: Build tools and toolchain
        run: |
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        if: always()
        run: |
          mkdir -p artifact
          if compgen -G "bin/targets/x86/64/*" > /dev/null; then
            cp -a bin/targets/x86/64/* artifact/
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-j4125-x86-64
          path: artifact/
          if-no-files-found: warn
          retention-days: 7
